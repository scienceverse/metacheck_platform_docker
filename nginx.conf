# The addresses of the SURF Research Cloud server, on port 3838 of this
# container: the website at / (/site/), its check pages at /researchbox/ and
# /datamanager/, the web interface at /api/ and the paper report app at
# /metacheck/ (as metacheck-nginx.conf.j2 and 00-root.conf there).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3838;
    # redirects keep the address the browser used (the port Docker publishes)
    absolute_redirect off;
    # The app and the web interface get that address with its port
    # ($http_host, not $host): the web interface builds the status and
    # result addresses of a job from it, and the website follows those.
    access_log off;
    client_max_body_size 505M;

    location = / {
        rewrite ^ /site/ last;
    }
    location /site/ {
        alias /srv/metacheck-site/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(datamanager|researchbox)$ {
        return 301 /$1/;
    }
    location ~ ^/(datamanager|researchbox)/(.*)$ {
        rewrite ^/(datamanager|researchbox)/(.*)$ /site/$1/$2 last;
    }

    location = /metacheck {
        return 301 /metacheck/;
    }
    location /metacheck/ {
        proxy_pass http://127.0.0.1:3839/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:2005/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering on;
    }
}
